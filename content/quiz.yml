# QCM. Champs : id, course, level, q, choices (liste), answer (indice 0-based), why
- {id: qz-his-01, course: histoire, level: 1, q: "Quel événement marque le début conventionnel de la Grande Dépression ?", choices: ["Le krach boursier d'octobre 1929", "La faillite de Lehman Brothers", "Le premier choc pétrolier", "La conférence de Bretton Woods"], answer: 0, why: "Krach de Wall Street, octobre 1929."}
- {id: qz-his-02, course: histoire, level: 1, q: "Quelle année voit la fin de la convertibilité du dollar en or décidée par Nixon ?", choices: ["1944", "1958", "1971", "1979"], answer: 2, why: "15 août 1971 ; le flottement des monnaies est généralisé en 1973."}
- {id: qz-his-03, course: histoire, level: 1, q: "Les « Trente Glorieuses » désignent la période :", choices: ["1918-1948", "1945-1973", "1960-1990", "1973-2003"], answer: 1, why: "1945-1973, terme forgé par Jean Fourastié (1979)."}
- {id: qz-his-04, course: histoire, level: 1, q: "Quel traité fonde la Communauté économique européenne ?", choices: ["Traité de Versailles (1919)", "Traité de Rome (1957)", "Traité de Maastricht (1992)", "Traité de Lisbonne (2007)"], answer: 1, why: "Traité de Rome, 1957. Maastricht (1992) prépare l'euro."}
- {id: qz-his-05, course: histoire, level: 2, q: "Lequel de ces auteurs a écrit « Les conséquences économiques de la paix » (1919) ?", choices: ["Irving Fisher", "John Maynard Keynes", "Milton Friedman", "Simon Kuznets"], answer: 1, why: "Keynes critique les réparations imposées à l'Allemagne par le traité de Versailles."}
- {id: qz-his-06, course: histoire, level: 2, q: "La courbe de Kuznets décrit, par hypothèse, une relation :", choices: ["En U inversé entre développement et inégalités", "En U entre inflation et chômage", "Décroissante entre taux d'intérêt et investissement", "Croissante entre épargne et croissance démographique"], answer: 0, why: "Kuznets (1955) : les inégalités augmenteraient puis diminueraient avec le développement."}
- {id: qz-his-07, course: histoire, level: 1, q: "La faillite de Lehman Brothers intervient :", choices: ["Le 24 octobre 1929", "Le 15 août 1971", "Le 15 septembre 2008", "Le 1er janvier 1999"], answer: 2, why: "15 septembre 2008, point culminant de la crise financière mondiale."}
- {id: qz-his-08, course: histoire, level: 2, q: "Les Corn Laws sont abolies au Royaume-Uni en :", choices: ["1776", "1815", "1846", "1914"], answer: 2, why: "Abrogation en 1846 : tournant libre-échangiste britannique."}
- {id: qz-his-09, course: histoire, level: 1, q: "L'euro est introduit comme monnaie scripturale en 1999. Les pièces et billets apparaissent en :", choices: ["2000", "2001", "2002", "2004"], answer: 2, why: "Circulation des pièces et billets en janvier 2002."}
- {id: qz-his-10, course: histoire, level: 2, q: "La « Grande Divergence » (Pomeranz) oppose principalement :", choices: ["Le Nord et le Sud de l'Europe au XIXe siècle", "L'Europe occidentale et l'Asie (Yangzi) autour de 1800", "L'URSS et les États-Unis après 1945", "L'Amérique latine et l'Afrique au XXe siècle"], answer: 1, why: "Pomeranz (2000) situe la divergence vers 1800, pas avant."}
- {id: qz-con-01, course: contemporaine, level: 1, q: "L'objectif d'inflation de la BCE est de :", choices: ["0 %", "1 %", "2 % à moyen terme, symétrique", "4 %"], answer: 2, why: "Cible symétrique de 2 % (stratégie révisée en 2021)."}
- {id: qz-con-02, course: contemporaine, level: 1, q: "Une propension marginale à consommer de 0,8 donne un multiplicateur simple de :", choices: ["1,25", "4", "5", "8"], answer: 2, why: "1 / (1 - 0,8) = 5."}
- {id: qz-con-03, course: contemporaine, level: 1, q: "Un déficit courant correspond à :", choices: ["Une épargne nationale supérieure à l'investissement", "Une épargne nationale inférieure à l'investissement", "Un budget de l'État excédentaire", "Un taux de change fixe"], answer: 1, why: "Solde courant = S - I ; négatif quand l'épargne ne finance pas l'investissement."}
- {id: qz-con-04, course: contemporaine, level: 2, q: "Si r > g et que le solde primaire est nul, le ratio dette/PIB :", choices: ["Diminue", "Reste constant", "Augmente", "Ne dépend pas de r"], answer: 2, why: "Δd ≈ (r - g) d - solde primaire : positif si r > g."}
- {id: qz-con-05, course: contemporaine, level: 1, q: "Un chômeur au sens du BIT est une personne :", choices: ["Inscrite à France Travail", "Sans emploi, disponible et recherchant activement un emploi", "Sans emploi depuis plus d'un an", "Bénéficiaire d'allocations chômage"], answer: 1, why: "Les trois critères sont cumulatifs ; l'inscription administrative n'est pas requise."}
- {id: qz-con-06, course: contemporaine, level: 1, q: "La désinflation correspond à :", choices: ["Une baisse générale des prix", "Un ralentissement de la hausse des prix", "Une hausse de la monnaie en circulation", "Une dépréciation du change"], answer: 1, why: "Les prix augmentent toujours, mais moins vite. La baisse des prix est la déflation."}
- {id: qz-con-07, course: contemporaine, level: 2, q: "Une appréciation du taux de change réel, toutes choses égales par ailleurs :", choices: ["Améliore la compétitivité-prix", "Détériore la compétitivité-prix", "N'a aucun effet sur les exportations", "Réduit mécaniquement l'inflation importée à zéro"], answer: 1, why: "Les biens nationaux deviennent relativement plus chers."}
- {id: qz-con-08, course: contemporaine, level: 1, q: "Le PIB mesure :", choices: ["Le bien-être de la population", "La richesse patrimoniale d'un pays", "La valeur ajoutée produite sur un territoire sur une période", "Les revenus après impôts des ménages"], answer: 2, why: "Un flux de production, pas un stock de richesse ni un indicateur de bien-être."}
- {id: qz-mic-01, course: micro, level: 1, q: "Un monopole non discriminant maximise son profit là où :", choices: ["Prix = coût marginal", "Recette marginale = coût marginal", "Recette moyenne = coût moyen", "Recette totale est maximale"], answer: 1, why: "Rm = Cm ; le prix se lit ensuite sur la demande, au-dessus du Cm."}
- {id: qz-mic-02, course: micro, level: 2, q: "Dans un duopole de Cournot symétrique (demande linéaire, coût c), le prix d'équilibre est :", choices: ["c", "(a + c) / 2", "(a + 2c) / 3", "(a + 3c) / 4"], answer: 2, why: "Q = 2(a - c) / (3b) donc P = a - bQ = (a + 2c) / 3."}
- {id: qz-mic-03, course: micro, level: 1, q: "À long terme, en concurrence parfaite, le profit économique est :", choices: ["Positif", "Négatif", "Nul", "Indéterminé"], answer: 2, why: "La libre entrée et sortie annule les profits économiques."}
- {id: qz-mic-04, course: micro, level: 2, q: "Le paradoxe de Bertrand affirme qu'avec deux firmes à coût identique et un bien homogène, l'équilibre en prix est :", choices: ["Le prix de monopole", "Le prix de Cournot", "Égal au coût marginal", "Indéterminé"], answer: 2, why: "Chaque firme a intérêt à sous-coter tant que p > c : on converge vers p = c."}
- {id: qz-mic-05, course: micro, level: 1, q: "Une firme en concurrence parfaite arrête de produire à court terme si le prix est inférieur :", choices: ["Au coût marginal minimum", "Au coût moyen minimum", "Au coût variable moyen minimum", "Au coût fixe"], answer: 2, why: "Seuil de fermeture : elle ne couvre plus ses coûts variables."}
- {id: qz-sta-01, course: stats, level: 1, q: "La p-value est :", choices: ["La probabilité que H0 soit vraie", "La probabilité d'observer un résultat au moins aussi extrême, si H0 est vraie", "La probabilité que le résultat soit dû au hasard", "Le risque de première espèce α"], answer: 1, why: "Elle est calculée sous H0 ; ce n'est pas la probabilité de H0, et α est un seuil fixé à l'avance."}
- {id: qz-sta-02, course: stats, level: 1, q: "Quand n est multiplié par 4, l'écart-type de la moyenne empirique est :", choices: ["Multiplié par 4", "Divisé par 4", "Divisé par 2", "Inchangé"], answer: 2, why: "σ / √n : √4 = 2."}
- {id: qz-sta-03, course: stats, level: 1, q: "Pour une distribution de revenus asymétrique à droite :", choices: ["Moyenne < médiane", "Moyenne = médiane", "Moyenne > médiane", "Aucun lien"], answer: 2, why: "Les valeurs élevées tirent la moyenne vers le haut."}
- {id: qz-sta-04, course: stats, level: 1, q: "Un test détecte 95 % des malades et 95 % des non-malades. Prévalence de 1 %. Probabilité d'être malade si positif ?", choices: ["95 %", "Environ 50 %", "Environ 16 %", "1 %"], answer: 2, why: "0,95 × 0,01 / (0,95 × 0,01 + 0,05 × 0,99) ≈ 0,161."}
- {id: qz-sta-05, course: stats, level: 1, q: "Laquelle de ces statistiques est la plus robuste aux valeurs extrêmes ?", choices: ["La moyenne", "L'écart-type", "L'écart interquartile", "L'étendue (max - min)"], answer: 2, why: "L'IQR ne dépend que des quartiles ; les trois autres bougent avec une seule valeur extrême."}
- {id: qz-sta-06, course: stats, level: 2, q: "Un test du khi-deux d'indépendance sur un tableau de contingence 3 × 4 a combien de degrés de liberté ?", choices: ["12", "7", "6", "11"], answer: 2, why: "(3 - 1) × (4 - 1) = 6."}
- {id: qz-sta-07, course: stats, level: 2, q: "On fait 20 tests indépendants à 5 % alors que H0 est vraie partout. Probabilité d'au moins un rejet ?", choices: ["5 %", "Environ 36 %", "Environ 64 %", "100 %"], answer: 2, why: "1 - 0,95^20 ≈ 0,64 : d'où la nécessité de corriger les comparaisons multiples."}
- {id: qz-sta-08, course: stats, level: 2, q: "p = 0,30 pour un test de différence de moyennes. Que peut-on dire ?", choices: ["Les moyennes sont égales", "Il n'y a pas de preuve suffisante d'une différence", "H0 a 30 % de chances d'être vraie", "L'écart entre les moyennes est de 30 %"], answer: 1, why: "Une p-value élevée traduit l'absence de preuve, pas la preuve de l'égalité, et ce n'est pas la probabilité de H0."}
- {id: qz-sta-09, course: stats, level: 2, q: "Holm par rapport à Bonferroni :", choices: ["Contrôle un risque différent, moins strict", "Contrôle le même risque (FWER) et rejette au moins autant d'hypothèses", "Ne s'applique qu'à des tests indépendants", "Contrôle la proportion de fausses découvertes (FDR)"], answer: 1, why: "Holm est uniformément au moins aussi puissant que Bonferroni, sans hypothèse supplémentaire ; c'est Benjamini-Hochberg qui contrôle le FDR."}
- {id: qz-sta-10, course: stats, level: 2, q: "Pour comparer les moyennes de deux groupes d'effectifs et de variances différents, on utilise par défaut :", choices: ["Le test t de Student avec variances égales", "Le test t de Welch", "Un test du khi-deux", "Un test de Bartlett"], answer: 1, why: "Welch ne suppose pas l'égalité des variances et est le choix par défaut de t.test() en R."}
- {id: qz-eco-01, course: econometrie, level: 2, q: "Si x et z sont positivement corrélés et que z a un effet positif sur y, omettre z conduit à un coefficient de x :", choices: ["Biaisé à la baisse", "Biaisé à la hausse", "Non biaisé", "Non défini"], answer: 1, why: "Biais = γ × δ, avec γ > 0 et δ > 0."}
- {id: qz-eco-02, course: econometrie, level: 2, q: "En présence d'hétéroscédasticité, les MCO sont :", choices: ["Biaisés et non convergents", "Sans biais mais avec erreurs-types usuelles invalides", "Efficaces", "Inutilisables"], answer: 1, why: "Les coefficients restent sans biais ; il faut des erreurs-types robustes."}
- {id: qz-eco-03, course: econometrie, level: 3, q: "L'hypothèse d'identification de la différence de différences est :", choices: ["Absence de chocs", "Tendances parallèles en l'absence de traitement", "Homoscédasticité", "Instrument fort"], answer: 1, why: "Les groupes traité et témoin auraient suivi la même évolution sans traitement."}
- {id: qz-rec-01, course: recherche, level: 3, q: "Parmi ces mesures, laquelle est additivement décomposable en inégalités intra et inter-groupes ?", choices: ["Gini", "Rapport de Palma", "Theil T", "Médiane"], answer: 2, why: "La famille GE est décomposable ; le Gini a un terme de chevauchement."}
- {id: qz-rec-02, course: recherche, level: 3, q: "Que se passe-t-il pour M quand on agrège des unités voisines en unités plus grandes ?", choices: ["M augmente toujours", "M diminue ou reste égal", "M est inchangé", "M devient négatif"], answer: 1, why: "M agrégé = M inter ; on perd le terme intra, qui est positif ou nul."}
- {id: qz-rec-03, course: recherche, level: 3, q: "Pour une même ville, D mesuré avec de très petites unités (5 habitants) est par rapport à un découpage plus grand :", choices: ["En général plus élevé (biais de petites unités)", "Toujours plus faible", "Identique", "Négatif"], answer: 0, why: "La variabilité d'échantillonnage gonfle D même sans ségrégation structurelle."}
