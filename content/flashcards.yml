# Banque de flashcards. Champs : id (unique, stable !), course, level (1-3), q, a
# Cours : micro | stats | econometrie | histoire | contemporaine | recherche | r
# Texte brut ; `code` entre accents graves est mis en forme. Pas de LaTeX (affichage dynamique).

# ---------------------------------------------------------------- MICRO (L1/L2)
- {id: mic-01, course: micro, level: 1, q: "Condition de maximisation du profit d'une firme preneuse de prix ?", a: "Prix = coût marginal (p = Cm), avec Cm croissant. Plus généralement recette marginale = coût marginal."}
- {id: mic-02, course: micro, level: 1, q: "Quelle est la courbe d'offre de court terme d'une firme en concurrence parfaite ?", a: "La partie croissante de la courbe de coût marginal située au-dessus du minimum du coût variable moyen (CVM). En dessous, la firme ferme (elle ne couvre pas ses coûts variables)."}
- {id: mic-03, course: micro, level: 1, q: "Équilibre de long terme en concurrence parfaite : quelles conditions ?", a: "Libre entrée et sortie : profit nul, donc p = coût moyen minimum (et p = Cm). Chaque firme produit à l'échelle efficace minimale."}
- {id: mic-04, course: micro, level: 1, q: "Définition du surplus du consommateur ?", a: "Aire comprise entre la courbe de demande inverse et le prix de marché, jusqu'à la quantité achetée : consentement à payer moins prix payé, cumulé."}
- {id: mic-05, course: micro, level: 1, q: "Pourquoi le monopole crée-t-il une perte sèche ?", a: "Il produit là où Rm = Cm, avec un prix supérieur au Cm : des échanges mutuellement avantageux (consentement à payer > coût marginal) n'ont pas lieu. La perte sèche est le triangle de surplus ainsi perdu."}
- {id: mic-06, course: micro, level: 2, q: "Règle de Lerner pour un monopole ?", a: "(p - Cm) / p = 1 / |ε|, où ε est l'élasticité-prix de la demande. Plus la demande est inélastique, plus la marge est élevée."}
- {id: mic-07, course: micro, level: 2, q: "Monopole, demande P = a - bQ, coût marginal constant c : Q*, P* ?", a: "Rm = a - 2bQ = c donc Q* = (a - c) / (2b) et P* = (a + c) / 2. La quantité de monopole est la moitié de la quantité concurrentielle."}
- {id: mic-08, course: micro, level: 2, q: "Duopole de Cournot, P = a - bQ, coût marginal c, firmes identiques : équilibre ?", a: "q_i = (a - c) / (3b) ; Q = 2(a - c) / (3b) ; P = (a + 2c) / 3. Avec N firmes : q_i = (a - c) / ((N + 1) b), et on tend vers la concurrence parfaite quand N augmente."}
- {id: mic-09, course: micro, level: 2, q: "Paradoxe de Bertrand ?", a: "Avec un bien homogène, deux firmes à coût marginal identique constant qui fixent les prix atteignent l'équilibre p = c et un profit nul : deux firmes suffisent à obtenir la concurrence parfaite."}
- {id: mic-10, course: micro, level: 2, q: "Stackelberg (P = a - bQ, coût c) : quantités du leader et du suiveur ?", a: "Leader : (a - c) / (2b). Suiveur (meilleure réponse) : (a - c) / (4b). Le leader produit plus que dans Cournot et gagne un avantage de premier joueur."}
- {id: mic-11, course: micro, level: 1, q: "Indice de Herfindahl-Hirschman (HHI) ?", a: "Somme des carrés des parts de marché. Entre 1/N (N firmes égales) et 1 (monopole) ; souvent exprimé sur 0-10 000."}
- {id: mic-12, course: micro, level: 1, q: "Définition de l'élasticité-prix de la demande ?", a: "ε = (dQ/dP) × (P/Q) : variation en % de la quantité demandée pour 1 % de variation du prix. La demande est élastique si |ε| > 1."}
- {id: mic-13, course: micro, level: 2, q: "Définition d'un équilibre de Nash ?", a: "Profil de stratégies tel qu'aucun joueur ne peut améliorer son gain en changeant seul de stratégie, étant donné les stratégies des autres."}
- {id: mic-14, course: micro, level: 3, q: "Cournot avec N firmes : lien entre marge moyenne, HHI et élasticité ?", a: "La marge de Lerner moyenne pondérée par les parts de marché vaut HHI / |ε|. Plus le marché est concentré et la demande inélastique, plus les marges sont élevées."}
- {id: mic-15, course: micro, level: 3, q: "Hotelling : minimiser ou maximiser la différenciation ?", a: "Avec des coûts de transport linéaires, le principe de différenciation minimale de Hotelling est faux (pas d'équilibre en prix en général). Avec des coûts quadratiques (d'Aspremont, Gabszewicz, Thisse 1979), les firmes choisissent la différenciation maximale pour atténuer la concurrence en prix."}
- {id: mic-16, course: micro, level: 1, q: "Quelle est la différence entre coût marginal et coût moyen ? Quand se coupent-ils ?", a: "Cm = coût de la dernière unité ; CM = coût total / quantité. Le Cm coupe le CM en son minimum : tant que Cm < CM, le CM baisse ; ensuite il monte."}

# ---------------------------------------------------------------- STATS (L1)
- {id: sta-01, course: stats, level: 1, q: "Formule de König-Huygens pour la variance ?", a: "Var(X) = E[X²] - (E[X])². La variance est l'espérance du carré moins le carré de l'espérance."}
- {id: sta-02, course: stats, level: 1, q: "Loi des grands nombres vs théorème central limite ?", a: "LGN : la moyenne empirique converge vers l'espérance. TCL : la moyenne centrée et réduite (× racine de n) converge en loi vers N(0,1), quelle que soit la loi d'origine (variance finie)."}
- {id: sta-03, course: stats, level: 1, q: "Intervalle de confiance à 95 % de la moyenne (grand échantillon) ?", a: "x̄ ± 1,96 × s / √n. En petit échantillon gaussien : quantile de Student à n - 1 degrés de liberté à la place de 1,96."}
- {id: sta-04, course: stats, level: 1, q: "Que mesure (et ne mesure pas) une p-value ?", a: "La probabilité, si H0 est vraie, d'observer une statistique au moins aussi extrême que celle observée. Ce n'est PAS la probabilité que H0 soit vraie."}
- {id: sta-05, course: stats, level: 1, q: "Erreurs de type I et II ; puissance ?", a: "Type I (α) : rejeter H0 vraie. Type II (β) : ne pas rejeter H0 fausse. Puissance = 1 - β."}
- {id: sta-06, course: stats, level: 1, q: "Un estimateur est dit sans biais quand ? Variance de la moyenne empirique ?", a: "E[θ̂] = θ. Pour des observations i.i.d., Var(x̄) = σ² / n."}
- {id: sta-07, course: stats, level: 1, q: "Coefficient de corrélation de Pearson : bornes et limite ?", a: "Entre -1 et 1 ; mesure la relation linéaire seulement. Corrélation nulle n'implique pas indépendance, et corrélation n'implique pas causalité."}
- {id: sta-08, course: stats, level: 1, q: "Moyenne ou médiane pour des revenus ?", a: "La médiane, plus robuste aux valeurs extrêmes. Pour une distribution asymétrique à droite (revenus), moyenne > médiane."}
- {id: sta-09, course: stats, level: 1, q: "Formule de Bayes ?", a: "P(A|B) = P(B|A) P(A) / P(B). Attention au taux de base : un test fiable sur une maladie rare donne beaucoup de faux positifs parmi les positifs."}
- {id: sta-10, course: stats, level: 1, q: "Règle 68-95-99,7 ?", a: "Pour une loi normale, environ 68 %, 95 % et 99,7 % des valeurs se trouvent à moins de 1, 2 et 3 écarts-types de la moyenne."}
- {id: sta-11, course: stats, level: 1, q: "Écart-type empirique : pourquoi diviser par n - 1 ?", a: "Pour que la variance empirique soit un estimateur sans biais de σ² : on a déjà utilisé un degré de liberté pour estimer la moyenne."}

# ---------------------------------------------------------------- ÉCONOMÉTRIE
- {id: eco-01, course: econometrie, level: 2, q: "Hypothèses de Gauss-Markov (MCO BLUE) ?", a: "Linéarité du modèle, exogénéité E[u|X] = 0, rang plein de X, erreurs sphériques (homoscédasticité et absence d'autocorrélation). MCO est alors de variance minimale parmi les estimateurs linéaires sans biais."}
- {id: eco-02, course: econometrie, level: 2, q: "Formule de l'estimateur MCO ?", a: "β̂ = (X'X)^-1 X'y. Les résidus sont orthogonaux aux régresseurs : X'e = 0."}
- {id: eco-03, course: econometrie, level: 2, q: "Biais de variable omise : sens et formule ?", a: "Si on omet z dans y = βx + γz + u, le coefficient de x est biaisé de γ × δ, où δ est le coefficient de la régression de z sur x. Pas de biais si γ = 0 ou si x et z sont non corrélés."}
- {id: eco-04, course: econometrie, level: 2, q: "Conditions de validité d'un instrument ?", a: "Pertinence : corrélé à la variable endogène (première étape). Exclusion/exogénéité : non corrélé au terme d'erreur, il n'affecte y qu'à travers x."}
- {id: eco-05, course: econometrie, level: 2, q: "Hétéroscédasticité : conséquences et remède ?", a: "MCO reste sans biais et convergent, mais les erreurs-types usuelles sont fausses. On utilise des erreurs-types robustes (White / HC) ou clusterisées."}
- {id: eco-06, course: econometrie, level: 2, q: "Effets fixes vs aléatoires ; test de Hausman ?", a: "Effets fixes : cohérent même si l'effet individuel est corrélé aux régresseurs. Effets aléatoires : plus efficace mais cohérent seulement s'il n'y a pas de corrélation. Hausman compare les deux : un rejet plaide pour les effets fixes."}
- {id: eco-07, course: econometrie, level: 2, q: "Différence de différences : hypothèse d'identification ?", a: "Tendances parallèles : en l'absence de traitement, groupes traité et témoin auraient évolué de la même façon. On teste les pré-tendances (event study) sans jamais les prouver."}
- {id: eco-08, course: econometrie, level: 3, q: "Régression sur discontinuité (RDD) : ce qui est identifié et l'hypothèse ?", a: "Un effet moyen local, au seuil. Hypothèse : continuité des résultats potentiels au seuil (pas de manipulation de la variable de score : test de densité de McCrary / Cattaneo)."}
- {id: eco-09, course: econometrie, level: 3, q: "Instrument faible : quel problème, quel repère ?", a: "Biais proche de celui des MCO et inférence non fiable. Repère historique : F de première étape > 10 (Stock-Yogo), jugé insuffisant par la littérature récente ; privilégier des tests robustes (Anderson-Rubin)."}
- {id: eco-10, course: econometrie, level: 1, q: "Interprétation d'un coefficient dans une régression log-log ?", a: "Une élasticité : une hausse de 1 % de x est associée à une variation de β % de y (ceteris paribus)."}
- {id: eco-11, course: econometrie, level: 3, q: "À quel niveau clusteriser les erreurs-types ?", a: "Au niveau où le traitement est assigné ou, plus généralement, où les erreurs sont corrélées (Abadie, Athey, Imbens, Wooldridge 2023). Attention au nombre de grappes : peu de grappes → inférence fragile (wild bootstrap)."}
- {id: eco-12, course: econometrie, level: 2, q: "Que signifie la multicolinéarité parfaite ? et imparfaite ?", a: "Parfaite : X'X non inversible, le modèle n'est pas identifié. Imparfaite : estimation possible mais variances gonflées (VIF élevé), coefficients instables."}

# ---------------------------------------------------------------- HISTOIRE ÉCONOMIQUE
- {id: his-01, course: histoire, level: 1, q: "Étalon-or classique : période et principe ?", a: "Environ 1870-1914. Monnaies définies par un poids d'or, changes fixes et ajustement automatique de la balance des paiements (mécanisme de flux d'espèces)."}
- {id: his-02, course: histoire, level: 1, q: "Grande Dépression : déclencheur et transmission ?", a: "Krach de Wall Street (octobre 1929), puis vague de faillites bancaires, déflation et contraction de la masse monétaire ; l'attachement à l'étalon-or a propagé la crise (Eichengreen)."}
- {id: his-03, course: histoire, level: 1, q: "Bretton Woods (1944) : principes et fin ?", a: "Changes fixes mais ajustables ancrés sur le dollar, lui-même convertible en or ; création du FMI et de la Banque mondiale. Fin de la convertibilité par Nixon le 15 août 1971, flottement généralisé en 1973."}
- {id: his-04, course: histoire, level: 1, q: "Trente Glorieuses : bornes et moteurs ?", a: "1945-1973 (terme de Fourastié, 1979). Reconstruction et rattrapage, diffusion du fordisme, investissement élevé, État-providence, commerce croissant. Fin : chocs pétroliers et ralentissement de la productivité."}
- {id: his-05, course: histoire, level: 1, q: "Chocs pétroliers ?", a: "1973 (embargo de l'OPAEP lors de la guerre du Kippour) et 1979 (révolution iranienne). Ils déclenchent la stagflation : inflation et chômage élevés simultanément."}
- {id: his-06, course: histoire, level: 2, q: "Grande divergence (Pomeranz, 2000) : thèse ?", a: "L'écart de richesse entre l'Europe occidentale (surtout l'Angleterre) et l'Asie (delta du Yangzi) est récent, vers 1800, et tient notamment au charbon et aux ressources du Nouveau Monde."}
- {id: his-07, course: histoire, level: 2, q: "Courbe de Kuznets (1955) ?", a: "Hypothèse d'une courbe en U inversé : les inégalités montent puis baissent au fil du développement. Piketty la conteste : la baisse du XXe siècle tient aux chocs (guerres, impôts) plus qu'à un mécanisme automatique."}
- {id: his-08, course: histoire, level: 1, q: "Principales étapes de la construction européenne ?", a: "CECA 1951, traité de Rome (CEE) 1957, marché unique 1993, Maastricht (signé 1992), euro scriptural 1999 et pièces et billets 2002."}
- {id: his-09, course: histoire, level: 1, q: "Crise de 2008 : séquence ?", a: "Éclatement de la bulle immobilière américaine et crise des subprimes (2007), faillite de Lehman Brothers le 15 septembre 2008, crise financière mondiale puis crise des dettes souveraines en zone euro (2010-2012)."}
- {id: his-10, course: histoire, level: 2, q: "Corn Laws et libre-échange britannique ?", a: "Abolition des Corn Laws (droits sur le blé) en 1846 : symbole du tournant libre-échangiste britannique (Ricardo et l'avantage comparatif en arrière-plan)."}
- {id: his-11, course: histoire, level: 2, q: "Piège malthusien : principe et sortie ?", a: "Quand le revenu par tête monte, la population croît et ramène le revenu au niveau de subsistance. La croissance moderne (XIXe siècle) rompt ce lien grâce aux gains de productivité et à la transition démographique."}
- {id: his-12, course: histoire, level: 2, q: "Plan Marshall ?", a: "Programme américain d'aide à la reconstruction de l'Europe (annoncé en 1947, appliqué 1948-1951), conditionné à une coopération entre bénéficiaires (OECE)."}

# ---------------------------------------------------------------- ÉCONOMIE CONTEMPORAINE
- {id: con-01, course: contemporaine, level: 1, q: "Définition du PIB et limites ?", a: "Valeur ajoutée totale produite sur un territoire, sur une période. Limites : ignore le travail domestique, les externalités et l'épuisement du capital naturel, la répartition, le bien-être."}
- {id: con-02, course: contemporaine, level: 1, q: "Objectif d'inflation de la BCE ?", a: "2 % à moyen terme, de façon symétrique (stratégie révisée en 2021). Mesure usuelle : l'indice des prix à la consommation harmonisé (IPCH)."}
- {id: con-03, course: contemporaine, level: 1, q: "Chômage au sens du BIT ?", a: "Sans emploi, disponible pour travailler dans les deux semaines et recherchant activement un emploi (démarches dans les quatre dernières semaines). Le taux de chômage rapporte les chômeurs à la population active."}
- {id: con-04, course: contemporaine, level: 1, q: "Qu'est-ce que l'assouplissement quantitatif (QE) ?", a: "Achats massifs d'actifs (titres publics, parfois privés) par la banque centrale pour baisser les taux longs et injecter de la liquidité quand le taux directeur est proche de zéro."}
- {id: con-05, course: contemporaine, level: 1, q: "Identité de la balance courante ?", a: "Solde courant = épargne nationale - investissement. Un déficit courant correspond à un besoin de financement extérieur."}
- {id: con-06, course: contemporaine, level: 1, q: "Multiplicateur keynésien simple ?", a: "1 / (1 - c) avec c la propension marginale à consommer (économie fermée, sans impôt proportionnel). Avec c = 0,8 : 5. Il est plus faible avec impôts et importations."}
- {id: con-07, course: contemporaine, level: 2, q: "Dynamique du ratio dette/PIB ?", a: "Δd ≈ (r - g) × d - solde primaire (en % du PIB). Si r > g, un solde primaire nul fait croître le ratio ; si r < g, la croissance seule le réduit."}
- {id: con-08, course: contemporaine, level: 1, q: "Courbe de Phillips ?", a: "Relation inverse de court terme entre inflation et chômage. Dans la version augmentée des anticipations (Friedman, Phelps), pas d'arbitrage durable : le chômage revient vers son niveau naturel (NAIRU)."}
- {id: con-09, course: contemporaine, level: 2, q: "Taux de change réel ?", a: "e × P* / P (taux nominal en prix du pays étranger / prix domestique). Une appréciation réelle dégrade la compétitivité-prix."}
- {id: con-10, course: contemporaine, level: 1, q: "Inflation, désinflation, déflation ?", a: "Inflation : hausse générale et durable des prix. Désinflation : ralentissement de l'inflation (les prix montent moins vite). Déflation : baisse générale et persistante des prix."}
- {id: con-11, course: contemporaine, level: 1, q: "Différence entre revenu primaire et revenu disponible ?", a: "Revenu primaire : avant redistribution (salaires, revenus du capital). Revenu disponible : après impôts directs et prestations sociales. Les inégalités sont plus faibles en revenu disponible."}

# ---------------------------------------------------------------- RECHERCHE : SÉGRÉGATION & INÉGALITÉS
- {id: rec-01, course: recherche, level: 2, q: "Interprétation de l'indice de dissimilarité D de Duncan ?", a: "Part (minimale) de l'un des deux groupes qui devrait changer d'unité pour égaliser la répartition des deux groupes entre les unités. Valeur 0 : répartition identique ; 1 : séparation complète."}
- {id: rec-02, course: recherche, level: 3, q: "Biais de petites unités des indices de ségrégation ?", a: "Même sans ségrégation structurelle, l'indice observé est positif en échantillon fini, d'autant plus que les unités sont petites. Pistes : benchmark par allocation aléatoire, indices corrigés (Carrington-Troske 1997), inférence (Allen, Burgess, Davidson, Windmeijer 2015)."}
- {id: rec-03, course: recherche, level: 3, q: "Indice d'information mutuelle M : définition et intérêt ?", a: "M = E - Σ t_i E_i, où E est l'entropie de la composition globale et E_i celle de l'unité i. Multigroupe et décomposable en parties entre/intra (zones emboîtées, groupes). H = M / E est normalisé dans [0, 1]."}
- {id: rec-04, course: recherche, level: 3, q: "Décomposition de M entre grandes zones ?", a: "M total = M inter (M calculé sur les zones agrégées) + Σ_r (N_r / N) × M_r (M intra pondéré par la taille des zones). Agréger des unités ne peut donc que réduire M : la perte est le terme intra."}
- {id: rec-05, course: recherche, level: 3, q: "Indice d'isolement vs indice d'interaction ?", a: "Isolement du groupe X : probabilité qu'un membre de X ait pour voisin un autre membre de X. Interaction : même chose avec un membre de Y. Ils dépendent de la taille relative du groupe (contrairement à D)."}
- {id: rec-06, course: recherche, level: 3, q: "MAUP (modifiable areal unit problem) ?", a: "Les mesures de ségrégation dépendent du découpage spatial (effet d'échelle et effet de zonage). Les conclusions doivent être testées à plusieurs échelles, ou avec des mesures spatiales."}
- {id: rec-07, course: recherche, level: 2, q: "Famille d'entropie généralisée GE(α) : paramètre et cas particuliers ?", a: "α fort : sensible aux transferts au sommet de la distribution ; α faible ou négatif : sensible au bas. α = 0 : écart logarithmique moyen (MLD) ; α = 1 : Theil T ; α = 2 : demi-carré du coefficient de variation."}
- {id: rec-08, course: recherche, level: 3, q: "Pourquoi préférer GE au Gini pour décomposer par groupes ?", a: "Les GE sont additivement décomposables en inégalité intra et inter-groupes. Le Gini ne l'est pas : il s'y ajoute un terme de chevauchement des distributions (overlap)."}
- {id: rec-09, course: recherche, level: 2, q: "Indice d'Atkinson : définition et rôle de ε ?", a: "A(ε) = 1 - ξ / μ, où ξ est le revenu équivalent également réparti (celui qui donnerait la même utilité sociale). ε est l'aversion sociale pour l'inégalité : ε = 0 donne A = 0 ; plus ε est élevé, plus le bas de la distribution compte."}
- {id: rec-10, course: recherche, level: 3, q: "Dominance de Lorenz (Atkinson 1970) ?", a: "Si la courbe de Lorenz de A est partout au-dessus de celle de B (sans croisement), alors toute mesure respectant le principe de transfert de Pigou-Dalton (et l'invariance d'échelle) juge A moins inégale que B. Si elles se croisent, les indices peuvent se contredire."}
- {id: rec-11, course: recherche, level: 3, q: "Distribution de Pareto : coefficient et Gini ?", a: "Part des individus au-dessus de y proportionnelle à y^-α. Le coefficient de Pareto inversé b = α / (α - 1) mesure l'épaisseur de la queue. Le Gini de la loi de Pareto vaut 1 / (2α - 1) pour α > 1."}
- {id: rec-12, course: recherche, level: 3, q: "Inférence pour un indice d'inégalité ou de ségrégation ?", a: "Ces indices sont des fonctions non linéaires des données : on utilise le bootstrap ou la méthode delta, en tenant compte du plan de sondage (poids, strates, grappes). Les erreurs-types « naïves » sont trompeuses."}
- {id: rec-13, course: recherche, level: 2, q: "Principe de transfert de Pigou-Dalton ?", a: "Un transfert d'un individu plus riche vers un individu plus pauvre (sans inverser leur rang) doit faire baisser (ou ne pas augmenter) l'indice d'inégalité."}

# ---------------------------------------------------------------- R
- {id: r-01, course: r, level: 1, q: "Pourquoi `seq_len(n)` plutôt que `1:n` dans une boucle ?", a: "Si n = 0, `1:0` vaut c(1, 0) et la boucle s'exécute deux fois à tort ; `seq_len(0)` est vide."}
- {id: r-02, course: r, level: 2, q: "`vapply` vs `sapply` ?", a: "`vapply` impose le type et la longueur de sortie (`FUN.VALUE`) : il échoue de façon explicite au lieu de renvoyer silencieusement une liste ou un type inattendu."}
- {id: r-03, course: r, level: 1, q: "`[` vs `[[` ?", a: "`x[i]` renvoie un sous-ensemble du même type (une liste reste une liste) ; `x[[i]]` extrait l'élément lui-même."}
- {id: r-04, course: r, level: 2, q: "Comment rendre une simulation reproductible ?", a: "`set.seed()` en début de script (et par worker en parallèle, avec `RNGkind(\"L'Ecuyer-CMRG\")`), versions de paquets figées avec `renv`."}
- {id: r-05, course: r, level: 2, q: "Opérateur `{{ }}` (embrace) en tidy evaluation ?", a: "Dans une fonction, `{{ var }}` transmet le nom de colonne reçu en argument à une fonction dplyr/ggplot2 : `summarise(df, m = mean({{ var }}))`."}
- {id: r-06, course: r, level: 2, q: "Pourquoi éviter de faire pousser un vecteur dans une boucle (`x <- c(x, v)`) ?", a: "Chaque itération recopie le vecteur : coût quadratique. Préallouer (`numeric(n)`) ou utiliser `vapply`/`replicate`."}
- {id: r-07, course: r, level: 3, q: "Pondérations d'enquête : où les mettre dans un calcul d'indice ?", a: "Dans l'estimateur (moyennes et parts pondérées) ET dans l'inférence (bootstrap sur le plan de sondage, paquet `survey` ou `convey`). Passer `w` à une fonction qui l'ignore est une erreur silencieuse fréquente."}
